services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: newsagent-backend:latest
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      FRONTEND_ORIGIN: http://localhost
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - newsagent-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: newsagent-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - newsagent-net

networks:
  newsagent-net:
    driver: bridge
