[project]
name = "newsagent"
version = "0.1.0"
description = "FastAPI + LangGraph news agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain",
    "langchain-openai",
    "groq",
    "tavily-python",
    "beautifulsoup4",
    "requests",
    "python-dotenv",
    "pydantic",
    "httpx",
    "pytest",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
