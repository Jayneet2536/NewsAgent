server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml text/javascript;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- SSE streaming endpoint (must come before the general /api/ block) ---
    location /api/research/stream {
        proxy_pass http://backend:8000/api/research/stream;
        proxy_http_version 1.1;

        # Disable every layer of buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Long timeout — the AI pipeline can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # Prevent nginx from compressing the stream (breaks chunked SSE)
        proxy_set_header Accept-Encoding "";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        chunked_transfer_encoding on;

        # Tell downstream caches not to buffer
        add_header X-Accel-Buffering no;
    }

    # --- All other API routes (non-streaming) ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
